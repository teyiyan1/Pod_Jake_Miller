image: alpine:3.20

pages:
  stage: deploy
  script:
    - rm -rf public
    - mkdir -p public
    - cp index.html styles.css artists.css app.js ambient.js apple-music.js artist-music.js artist-water.js artists.js lyric-timing.js room-ripple.js public/
    - cp -R audio artwork data vendor public/
  artifacts:
    paths:
      - public
  only:
    - water-wave
